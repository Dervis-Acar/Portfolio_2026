name: Deploy to Oracle server

# Pull-based deploy, matching the PlannerPWA setup: appleboy/ssh-action
# connects with three secrets, then the server syncs itself from GitHub.
#
#   ORACLE_HOST      server IP or hostname
#   ORACLE_USER      ssh user (e.g. ubuntu)
#   ORACLE_SSH_KEY   the deploy private key, whole file including BEGIN/END
#
# The repo is public, so the server fetches anonymously - no GITHUB_TOKEN is
# written into .git/config on disk.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The server deploys whatever is committed, so the committed stylesheet has
  # to match its source. Without this guard, editing src/site.css and
  # forgetting `npm run build:css` would silently ship the previous styles.
  verify-build:
    name: Verify committed CSS is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Rebuild and compare against what is committed
        run: |
          npm run build:css
          # Scope the comparison to the build's outputs: the compiled
          # stylesheet and the hash stamps it writes into each page.
          if ! git diff --quiet -- assets/css/site.css ./*.html; then
            echo "::error::assets/css/site.css is out of date. Run 'npm run build:css' and commit the result."
            git --no-pager diff --stat -- assets/css/site.css ./*.html
            exit 1
          fi
          echo "Committed CSS matches src/site.css."

  deploy:
    name: Deploy
    needs: verify-build
    runs-on: ubuntu-latest
    steps:
      - name: Sync the server from GitHub
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd /var/www/dervis.be

            if [ ! -d .git ]; then
              git init -b master
              git remote add origin https://github.com/Dervis-Acar/Portfolio_2026.git
            fi
            git remote set-url origin https://github.com/Dervis-Acar/Portfolio_2026.git

            git fetch origin master
            git reset --hard origin/master

            # reset --hard only touches tracked files. Without this, anything
            # left behind by an earlier deploy - including the old styles.css
            # and tailwind-config.js - lingers in the web root forever.
            git clean -fd

            echo "deployed $(git rev-parse --short HEAD) to $(pwd)"
